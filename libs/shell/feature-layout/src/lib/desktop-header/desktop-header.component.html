<header class="header">

  <div class="header__left">
    <span class="company">{{workspace.company()?.name}}</span>
    <span>|</span>
    <ct-context-select
      [items]="locationItems()"
      [selectedId]="workspace.currentLocationId()"
      [disabled]="!workspace.hasMultipleLocations()"
      (selected)="workspace.selectLocation($event)"
    ></ct-context-select>

  </div>

  <div class="header__center">
    <ct-input>
      <ct-icon
        ctInputPrefix
        name="search"
      ></ct-icon>
    </ct-input>
  </div>

  <div class="header__right">
    <ct-date-picker></ct-date-picker>
    <ct-button (clicked)="onLogout()">Выйти</ct-button>
  </div>

</header>
