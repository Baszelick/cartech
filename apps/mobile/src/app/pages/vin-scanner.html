<ion-header>
  <ion-toolbar>
    <ct-image-logo
      slot="start"
      class="header-logo"
      borderRadius="var(--radius-8)"
      [size]="42"
      imageColor="var(--color-bg-surface)"
      backgroundColor="var(--color-brand-blue)"
    />

    <ion-title class="brand-text">Car<span>Tech</span></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Сканирование VIN</h1>

  <ion-button
    class="camera-button"
    expand="block"
    (click)="takePhoto()"
  >
    Сфотографировать VIN
  </ion-button>

  @if (photoUrl(); as photo) {
    <img
      [src]="photo"
      alt="Фото VIN"
      class="vin-photo"
    >
  }

  @if (vin()) {
    <h2 class="recognized-text">{{ vin() }}</h2>
  } @else {
    <p>Текст пока не распознан</p>
  }
</ion-content>
